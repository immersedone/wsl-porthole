[package]
name    = "wsl-porthole-service"
version = "0.4.7"
edition = "2021"

[[bin]]
name = "wsl-porthole-service"
path = "src/main.rs"

[dependencies]
wsl-porthole-core  = { path = "../wsl-porthole-core" }
windows-service    = "0.7"
tokio              = { version = "1", features = ["full"] }
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = "0.3"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_EventLog",
] }
