<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#1f6feb"/>
    </linearGradient>
    <linearGradient id="arrow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#58a6ff"/>
    </linearGradient>
    <linearGradient id="arrow2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#d29922"/>
      <stop offset="100%" style="stop-color:#58a6ff"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>

  <!-- Outer porthole ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ring)" stroke-width="28" opacity="0.9"/>

  <!-- Inner porthole ring (glass edge) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#30363d" stroke-width="4"/>

  <!-- Porthole bolts (4 corners) -->
  <circle cx="256" cy="80" r="14" fill="#58a6ff" opacity="0.8"/>
  <circle cx="256" cy="432" r="14" fill="#58a6ff" opacity="0.8"/>
  <circle cx="80" cy="256" r="14" fill="#58a6ff" opacity="0.8"/>
  <circle cx="432" cy="256" r="14" fill="#58a6ff" opacity="0.8"/>

  <!-- Bolt inner dots -->
  <circle cx="256" cy="80" r="6" fill="#0d1117"/>
  <circle cx="256" cy="432" r="6" fill="#0d1117"/>
  <circle cx="80" cy="256" r="6" fill="#0d1117"/>
  <circle cx="432" cy="256" r="6" fill="#0d1117"/>

  <!-- Arrow RIGHT: Windows → WSL (green to blue) -->
  <g transform="translate(0, -30)">
    <line x1="140" y1="256" x2="330" y2="256" stroke="url(#arrow1)" stroke-width="18" stroke-linecap="round"/>
    <polygon points="340,256 310,232 310,280" fill="#58a6ff"/>
  </g>

  <!-- Arrow LEFT: WSL → Windows (yellow to blue) -->
  <g transform="translate(0, 30)">
    <line x1="372" y1="286" x2="182" y2="286" stroke="url(#arrow2)" stroke-width="18" stroke-linecap="round"/>
    <polygon points="172,286 202,262 202,310" fill="#58a6ff"/>
  </g>

  <!-- Small network dots along arrows -->
  <circle cx="190" cy="226" r="6" fill="#3fb950" opacity="0.7"/>
  <circle cx="240" cy="226" r="6" fill="#3fb950" opacity="0.5"/>
  <circle cx="290" cy="226" r="6" fill="#58a6ff" opacity="0.7"/>

  <circle cx="322" cy="286" r="6" fill="#d29922" opacity="0.7"/>
  <circle cx="272" cy="286" r="6" fill="#d29922" opacity="0.5"/>
  <circle cx="222" cy="286" r="6" fill="#58a6ff" opacity="0.7"/>
</svg>
